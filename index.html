<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cinematic Creator Studio Pro</title>

<style>
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle at top,#1a0000,#000000);
color:white;
overflow-x:hidden;
}

/* HEADER */
.header{
background:linear-gradient(90deg,#ff0000,#990000);
padding:15px;
text-align:center;
font-weight:bold;
box-shadow:0 0 20px red;
position:relative;
z-index:2;
font-size:18px;
}

/* CENTER LAYOUT */
.container{
display:flex;
flex-direction:column;
align-items:center;
}

/* GLASS CARD */
.card{
background:rgba(255,255,255,0.08);
backdrop-filter: blur(12px);
border:1px solid rgba(255,255,255,0.1);
padding:15px;
margin-top:15px;
border-radius:15px;
animation:fade 0.6s ease;
width:90%;
max-width:500px;
}

@keyframes fade{
from{opacity:0; transform:translateY(10px);}
to{opacity:1; transform:translateY(0);}
}

/* INPUT */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
outline:none;
font-size:16px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#ff0000,#ff4d4d);
color:white;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

/* TAGS */
.tag{
display:inline-block;
padding:6px 10px;
margin:4px;
background:rgba(255,0,0,0.2);
border:1px solid rgba(255,0,0,0.3);
border-radius:20px;
font-size:12px;
}

/* FOOTER */
.footer{
margin-top:20px;
padding:20px;
background:linear-gradient(135deg,#ff0000,#330000);
text-align:center;
border-radius:15px;
box-shadow:0 0 20px red;
width:90%;
max-width:500px;
}

/* ANIMATION LAYER */
#animation-layer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
z-index:0;
overflow:hidden;
}

.play{
position:absolute;
animation:fall linear infinite;
opacity:0.8;
filter: drop-shadow(0 0 6px gold);
}

@keyframes fall{
0%{transform:translateY(-10vh) rotate(0deg);}
100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:radial-gradient(circle,transparent,black);
z-index:1;
pointer-events:none;
opacity:0.6;
}
</style>
</head>

<body>

<div class="overlay"></div>
<div id="animation-layer"></div>

<div class="header">
🔥 Cinematic Creator Studio Pro
</div>

<div class="container">

<div class="card">
<input id="niche" placeholder="Enter niche">
<input id="title" placeholder="Enter title">

<select id="lang">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="hinglish">Hinglish</option>
</select>

<button onclick="generate()">🚀 Generate AI Pack</button>
</div>

<div class="card">
<h3>🏷 Tags</h3>
<div id="tags"></div>
</div>

<div class="card">
<h3>🔥 Hashtags</h3>
<div id="hash"></div>
</div>

<div class="footer">
<h3>📩 For Enquiry</h3>

Instagram: ig_krissna <br>
YouTube: ig krissna <br>
Gmail: igkrissna@gmail.com <br><br>

🔥 Built for Creators
</div>

</div>

<script>

// ANIMATION
function createPlay(){
const layer=document.getElementById("animation-layer");

let icons=["▶","🥈","🏆","💎","⭐","🔥"];

let el=document.createElement("div");
el.classList.add("play");
el.innerText=icons[Math.floor(Math.random()*icons.length)];

el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(2+Math.random()*3)+"s";
el.style.fontSize=(14+Math.random()*22)+"px";

layer.appendChild(el);

setTimeout(()=>el.remove(),5000);
}
setInterval(createPlay,200);

// GENERATE AI PACK
function generate(){

let niche=document.getElementById("niche").value.toLowerCase();
let title=document.getElementById("title").value.toLowerCase();

document.getElementById("tags").innerHTML="🤖 AI analyzing...";
document.getElementById("hash").innerHTML="⚡ generating...";

setTimeout(()=>{

let tags=[];
let hash=[];

// BASE
tags.push("viral video","trending","youtube shorts","must watch","2026");
hash.push("#viral","#trending","#youtube","#shorts");

// NICHE
if(niche.includes("cricket")){
tags.push("ms dhoni","virat kohli","ipl highlights","world cup","cricket news","ranchi stadium");
hash.push("#cricket","#IPL","#BCCI","#worldcup");
}

if(niche.includes("gaming")){
tags.push("bgmi","free fire","pro gameplay","headshot","live stream","esports");
hash.push("#gaming","#BGMI","#freefire","#esports");
}

if(niche.includes("ai")){
tags.push("chatgpt","ai tools","future tech","automation","innovation","digital world");
hash.push("#AI","#tech","#chatgpt","#future");
}

// REMOVE DUPLICATES
tags=[...new Set(tags)].slice(0,12);
hash=[...new Set(hash)].slice(0,10);

// SHOW
document.getElementById("tags").innerHTML=
tags.map(t=>`<span class="tag">${t}</span>`).join("");

document.getElementById("hash").innerHTML=
hash.map(t=>`<span class="tag">${t}</span>`).join("");

},1200);

}
</script>

</body>
</html>

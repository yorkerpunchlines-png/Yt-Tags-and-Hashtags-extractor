<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Creator Studio Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#111;
overflow-x:hidden;
}

/* TOP BANNER */

.top-banner{
width:100%;
display:flex;
justify-content:center;
padding:15px 10px;
position:relative;
z-index:2;
}

.top-banner img{
width:95%;
max-width:550px;
border-radius:20px;
box-shadow:
0 0 15px rgba(255,0,0,.4),
0 0 35px rgba(255,0,0,.2);
animation:glow 3s infinite alternate;
}

@keyframes glow{
from{transform:scale(1);}
to{transform:scale(1.02);}
}

/* HEADER */

.header{
background:#ff0000;
color:white;
text-align:center;
padding:15px;
font-size:20px;
font-weight:bold;
box-shadow:0 4px 15px rgba(255,0,0,.4);
position:relative;
z-index:2;
}

/* CONTAINER */

.container{
display:flex;
flex-direction:column;
align-items:center;
padding-bottom:20px;
}

/* CARDS */

.card{
width:90%;
max-width:500px;
background:white;
margin-top:15px;
padding:15px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
border:1px solid #eee;
position:relative;
z-index:2;
}

/* INPUTS */

input,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:2px solid #ff0000;
outline:none;
font-size:16px;
background:white;

box-shadow:
0 0 10px rgba(255,255,255,.9),
0 0 15px rgba(255,0,0,.15);

transition:.3s;
}

input:focus,
select:focus{
box-shadow:
0 0 15px white,
0 0 25px #ff0000,
0 0 35px rgba(255,0,0,.4);
}

/* BUTTON */

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:12px;
background:#ff0000;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;

box-shadow:
0 0 15px rgba(255,0,0,.5);

transition:.3s;
}

button:hover{
transform:translateY(-2px);

box-shadow:
0 0 20px #ff0000,
0 0 40px rgba(255,0,0,.4);
}

/* TAGS */

.tag{
display:inline-block;
padding:7px 12px;
margin:4px;
background:#fff5f5;
border:1px solid #ff0000;
color:#ff0000;
font-size:12px;
font-weight:bold;
border-radius:20px;
}

/* FOOTER */

.footer{
width:90%;
max-width:500px;
margin-top:20px;
padding:20px;
background:white;
border-radius:15px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
border:1px solid #eee;
}

/* FLOATING ICONS */

#animation-layer{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
overflow:hidden;
z-index:0;
}

.play{
position:absolute;
animation:fall linear infinite;
opacity:.7;
}

@keyframes fall{
0%{
transform:translateY(-10vh) rotate(0deg);
}
100%{
transform:translateY(110vh) rotate(360deg);
opacity:0;
}
}

.ai-status{
display:inline-block;
padding:10px;
color:#ff0000;
font-weight:bold;
}

</style>
</head>

<body>

<div id="animation-layer"></div>

<!-- TOP IMAGE -->
<div class="top-banner">
<img src="banner.jpg" alt="Banner">
</div>

<!-- HEADER -->
<div class="header">
🔥 Cinematic Creator Studio Pro
</div>

<div class="container">

<div class="card">

<input id="niche" placeholder="Enter niche">

<input id="title" placeholder="Enter title">

<select id="lang">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="hinglish">Hinglish</option>
</select>

<button onclick="generate()">
🚀 Generate AI Pack
</button>

</div>

<div class="card">
<h3>🏷 Tags</h3>
<div id="tags"></div>
</div>

<div class="card">
<h3>🔥 Hashtags</h3>
<div id="hash"></div>
</div>

<div class="footer">

<h3>📩 For Enquiry</h3>

Instagram: ig_krissna <br>
YouTube: ig krissna <br>
Gmail: igkrissna@gmail.com

<br><br>

🔥 Built for Creators

</div>

</div>

<script>

/* FLOATING ICONS */

function createPlay(){

const layer=document.getElementById("animation-layer");

let icons=["▶️","🔴","❤️","🔥","⭐","🎬"];

let el=document.createElement("div");

el.classList.add("play");

el.innerText=icons[Math.floor(Math.random()*icons.length)];

el.style.left=Math.random()*100+"vw";

el.style.animationDuration=
(3+Math.random()*4)+"s";

el.style.fontSize=
(16+Math.random()*20)+"px";

layer.appendChild(el);

setTimeout(()=>{
el.remove();
},7000);

}

setInterval(createPlay,350);

/* AI GENERATOR */

function generate(){

let niche=
document.getElementById("niche")
.value.toLowerCase();

let title=
document.getElementById("title")
.value.toLowerCase();

document.getElementById("tags").innerHTML=
"<div class='ai-status'>🤖 AI analyzing content...</div>";

document.getElementById("hash").innerHTML=
"<div class='ai-status'>⚡ Finding viral hashtags...</div>";

setTimeout(()=>{

let tags=[];
let hash=[];

/* BASE */

tags.push(
"viral video",
"trending",
"youtube shorts",
"must watch",
"2026"
);

hash.push(
"#viral",
"#trending",
"#youtube",
"#shorts"
);

/* TITLE */

if(title.includes("viral")){
tags.push("viral content");
hash.push("#viralcontent");
}

if(title.includes("secret")){
tags.push("hidden facts");
hash.push("#secret");
}

/* CRICKET */

if(niche.includes("cricket")){
tags.push(
"ms dhoni",
"virat kohli",
"ipl highlights",
"world cup",
"cricket news"
);

hash.push(
"#cricket",
"#IPL",
"#worldcup",
"#BCCI"
);
}

/* GAMING */

if(niche.includes("gaming")){
tags.push(
"bgmi",
"free fire",
"headshot",
"pro gameplay",
"esports"
);

hash.push(
"#gaming",
"#BGMI",
"#freefire",
"#esports"
);
}

/* AI */

if(niche.includes("ai")){
tags.push(
"chatgpt",
"ai tools",
"future tech",
"automation",
"innovation"
);

hash.push(
"#AI",
"#chatgpt",
"#future",
"#tech"
);
}

tags=[...new Set(tags)].slice(0,12);
hash=[...new Set(hash)].slice(0,10);

document.getElementById("tags").innerHTML=
tags.map(
t=>`<span class="tag">${t}</span>`
).join("");

document.getElementById("hash").innerHTML=
hash.map(
t=>`<span class="tag">${t}</span>`
).join("");

},1500);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Creator Studio Pro</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#ffffff;
color:#111;
overflow-x:hidden;
}

/* TOP BANNER FIXED */
.top-banner{
width:100%;
display:flex;
justify-content:center;
padding:12px;
}

.top-banner img{
width:95%;
max-width:550px;
border-radius:20px;
display:block;
object-fit:cover;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

/* HEADER */
.header{
background:#ff0000;
color:white;
text-align:center;
padding:15px;
font-size:20px;
font-weight:bold;
box-shadow:0 4px 15px rgba(255,0,0,0.4);
}

/* CENTER */
.container{
display:flex;
flex-direction:column;
align-items:center;
padding-bottom:20px;
}

/* CARD */
.card{
width:90%;
max-width:500px;
background:white;
margin-top:15px;
padding:15px;
border-radius:15px;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
border:1px solid #eee;
}

/* INPUTS */
input,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:2px solid #ff0000;
outline:none;
font-size:16px;
background:white;
transition:0.3s;
}

input:focus,select:focus{
box-shadow:0 0 10px #ff0000;
}

/* BUTTON */
button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:12px;
background:#ff0000;
color:white;
font-weight:bold;
font-size:16px;
cursor:pointer;
box-shadow:0 0 15px rgba(255,0,0,0.4);
transition:0.3s;
}

button:hover{
transform:scale(1.03);
}

/* TAGS */
.tag{
display:inline-block;
padding:7px 12px;
margin:4px;
background:#fff5f5;
border:1px solid #ff0000;
color:#ff0000;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

/* FOOTER */
.footer{
width:90%;
max-width:500px;
margin-top:20px;
padding:20px;
background:white;
border-radius:15px;
text-align:center;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
border:1px solid #eee;
}

</style>
</head>

<body>

<!-- TOP BANNER (FIXED IMAGE NAME) -->
<div class="top-banner">
    <img src="1000078737.jpg" alt="Banner">
</div>

<!-- HEADER -->
<div class="header">
🔥 Cinematic Creator Studio Pro
</div>

<div class="container">

<div class="card">

<input id="niche" placeholder="Enter niche">
<input id="title" placeholder="Enter title">

<select id="lang">
<option>English</option>
<option>Hindi</option>
<option>Hinglish</option>
</select>

<button onclick="generate()">🚀 Generate AI Pack</button>

</div>

<div class="card">
<h3>🏷 Tags</h3>
<div id="tags"></div>
</div>

<div class="card">
<h3>🔥 Hashtags</h3>
<div id="hash"></div>
</div>

<div class="footer">
🔥 Built for Creators <br>
Instagram: ig_krissna
</div>

</div>

<script>

function generate(){

let niche=document.getElementById("niche").value.toLowerCase();
let title=document.getElementById("title").value.toLowerCase();

document.getElementById("tags").innerHTML="Loading...";
document.getElementById("hash").innerHTML="Loading...";

setTimeout(()=>{

let tags=[
"viral video","trending","youtube shorts","must watch","2026"
];

let hash=[
"#viral","#trending","#youtube","#shorts"
];

if(niche.includes("cricket")){
tags.push("ms dhoni","virat kohli","ipl","world cup");
hash.push("#cricket","#IPL","#BCCI");
}

if(niche.includes("gaming")){
tags.push("bgmi","free fire","headshot","esports");
hash.push("#gaming","#BGMI","#freefire");
}

if(niche.includes("ai")){
tags.push("chatgpt","ai tools","future tech");
hash.push("#AI","#tech","#chatgpt");
}

tags=[...new Set(tags)].slice(0,12);
hash=[...new Set(hash)].slice(0,10);

document.getElementById("tags").innerHTML=
tags.map(t=>`<span class="tag">${t}</span>`).join("");

document.getElementById("hash").innerHTML=
hash.map(t=>`<span class="tag">${t}</span>`).join("");

},1000);

}

</script>

</body>
</html>

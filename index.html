<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Creator Studio Pro</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    transition: 0.3s;
    background: #ffffff;
    color: #111;
}

.dark {
    background: #0f172a;
    color: white;
}

.header {
    background: #ff0000;
    color: white;
    padding: 15px;
    text-align: center;
    font-size: 20px;
    font-weight: bold;
}

.container {
    padding: 15px;
    text-align: center;
}

input, select {
    width: 90%;
    max-width: 400px;
    padding: 12px;
    margin: 8px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    padding: 12px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    background: #ff0000;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

button:hover { background: #cc0000; }

.card {
    margin-top: 15px;
    padding: 15px;
    border-radius: 12px;
    background: #fff5f5;
}

.dark .card {
    background: #1e293b;
}

.tag {
    display: inline-block;
    padding: 6px 10px;
    margin: 4px;
    background: #ffe0e0;
    border-radius: 20px;
    font-size: 13px;
}

.dark .tag {
    background: #334155;
    color: white;
}
</style>
</head>

<body>

<div class="header">
🔥 Creator Studio Pro (Next Level YouTube Tool)
</div>

<div class="container">

<button onclick="toggleMode()">🌙 Dark Mode</button>

<input id="niche" placeholder="Enter niche (cricket, gaming, ai)">
<input id="title" placeholder="Enter video idea">

<select id="lang">
<option value="en">English</option>
<option value="hi">Hindi</option>
<option value="hinglish">Hinglish</option>
</select>

<button onclick="generate()">🚀 AI Generate</button>
<button onclick="copyAll()">📋 Copy All</button>

<div class="card">
<h3>📊 Scores</h3>
<div id="score"></div>
</div>

<div class="card">
<h3>🎯 Viral Titles (A/B Test)</h3>
<div id="titles"></div>
</div>

<div class="card">
<h3>🖼️ Thumbnail Text Ideas</h3>
<div id="thumb"></div>
</div>

<div class="card">
<h3>🏷️ Tags</h3>
<div id="tags"></div>
</div>

<div class="card">
<h3>🔥 Hashtags</h3>
<div id="hash"></div>
</div>

</div>

<script>

let finalData = "";

function toggleMode(){
    document.body.classList.toggle("dark");
}

function generate(){

let niche = document.getElementById("niche").value.toLowerCase();
let title = document.getElementById("title").value;
let lang = document.getElementById("lang").value;

let tags = ["viral", "trending", "youtube", "2026", "must watch"];
let hash = ["#viral","#trending","#youtube"];

let titles = [
`🔥 ${title} | MUST WATCH 😱`,
`🚀 ${title} (100% Viral)`,
`😱 Nobody Expected This! ${title}`
];

let thumbs = [
"NO ONE EXPECTED THIS 😱",
"100% VIRAL VIDEO 🔥",
"WAIT FOR END 😳"
];

// niche boost
if(niche.includes("cricket")){
tags.push("cricket","ipl","world cup");
hash.push("#cricket","#IPL");
}

if(niche.includes("gaming")){
tags.push("bgmi","free fire","live");
hash.push("#gaming","#BGMI");
}

if(lang==="hi"){
tags.push("हिंदी","भारत","नया वीडियो");
}

if(lang==="hinglish"){
tags.push("new video","desi style","india");
}

// scores
let score = Math.floor(Math.random()*30 + 70);
let click = Math.floor(Math.random()*25 + 75);

document.getElementById("score").innerHTML =
`🔥 Viral Score: ${score}% <br> 🎯 Clickability: ${click}%`;

// show titles
document.getElementById("titles").innerHTML =
titles.map(t=>`<div class="tag">${t}</div>`).join("");

// thumbnails
document.getElementById("thumb").innerHTML =
thumbs.map(t=>`<div class="tag">${t}</div>`).join("");

// tags
document.getElementById("tags").innerHTML =
tags.map(t=>`<div class="tag">${t}</div>`).join("");

// hashtags
document.getElementById("hash").innerHTML =
hash.map(t=>`<div class="tag">${t}</div>`).join("");

finalData = titles.join("\n") + "\n" + tags.join(",") + "\n" + hash.join(",");
}

function copyAll(){
navigator.clipboard.writeText(finalData);
alert("Copied All Content 🚀");
}

</script>

</body>
</html>
